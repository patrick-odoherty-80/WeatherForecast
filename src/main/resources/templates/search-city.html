<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Enter City</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

<h3 style="text-align: center">Welcome to the Weather Dashboard</h3>
<p style="text-align: center">Please enter a city name to find today's weather and future forecast</p>
<br><br>

<form th:action="@{/weather}"  method="get" style="text-align: center">

    City: <input type="text" name="city"/>

    <button type="submit">Enter</button>


</form>
<hr>
<a th:href="@{/list}">View Weather Search History</a>

</body>
</html>
